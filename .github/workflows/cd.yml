  name: CD

  on:
    push:
      branches: [main]

  jobs:
    pruebas:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-node@v4
          with:
            node-version: 22
        - run: npm ci
        - run: npm test

    staging:
      needs: pruebas
      runs-on: ubuntu-latest
      environment: staging
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-node@v4
          with:
            node-version: 22
        - run: npm ci
        - name: Desplegar a staging
          uses: cloudflare/wrangler-action@v3
          with:
            apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
            accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
            command: deploy --env staging
        - name: Smoke test
          run: curl --fail --retry 3 --retry-delay 5 https://api-equipo-06-staging.SUBDOMINIO.workers.dev/health

    produccion:
      needs: staging
      runs-on: ubuntu-latest
      environment: production
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-node@v4
          with:
            node-version: 22
        - run: npm ci
        - name: Desplegar a produccion
          uses: cloudflare/wrangler-action@v3
          with:
            apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
            accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
            command: deploy
        - name: Smoke test
          run: curl --fail --retry 3 --retry-delay 5 https://api-equipo-06.SUBDOMINIO.workers.dev/health